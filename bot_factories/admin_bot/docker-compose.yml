name: admin-bot

services:
  worker:
    build:
      context: ../..
      dockerfile: bot_factories/admin_bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_TOKEN: ${ADMIN_BOT_TOKEN:?Set ADMIN_BOT_TOKEN}
    volumes:
      - admin_data:/app/bot_factories/admin_bot/.cache

volumes:
  admin_data:
