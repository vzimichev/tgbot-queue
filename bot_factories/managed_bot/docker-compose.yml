name: managed-bot

services:
  worker:
    build:
      context: ../..
      dockerfile: bot_factories/managed_bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MANAGED_BOT_DATABASE_PATH: /app/bot_factories/admin_bot/.cache/admin.sqlite3
    volumes:
      - managed_data:/app/bot_factories/admin_bot/.cache

volumes:
  managed_data:
